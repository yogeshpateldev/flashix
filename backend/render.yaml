services:
  - type: web
    name: flashix-backend
    runtime: node
    region: oregon  # Change to: ohio, singapore, frankfurt, or oregon
    plan: free      # Change to: starter ($7/mo) for no sleep
    rootDir: .      # This file should be inside /backend
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: LOG_LEVEL
        value: info
      - key: MONGO_URI
        sync: false   # Set manually in Render dashboard
      - key: REDIS_URL
        sync: false   # Set manually in Render dashboard
      - key: BULLMQ_REDIS_URL
        sync: false   # Set manually in Render dashboard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: SESSION_SECRET
        sync: false
      - key: BCRYPT_ROUNDS
        value: 12
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_ANON
        value: 20
      - key: RATE_LIMIT_MAX_USER
        value: 100
      - key: RATE_LIMIT_MAX_UPLOAD
        value: 5
      - key: MAX_UPLOAD_SIZE
        value: 104857600
      - key: ALLOWED_MIME_TYPES
        value: "image/jpeg,image/png,image/gif,image/webp,application/pdf,text/plain,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
      - key: DEFAULT_EXPIRY_HOURS
        value: 24
      - key: MAX_EXPIRY_HOURS
        value: 168
      - key: TRUST_PROXY
        value: true
      - key: FORCE_HTTPS
        value: true
      - key: ALLOWED_ORIGINS
        sync: false   # Set to your Vercel frontend URL
      - key: WORKER_CONCURRENCY
        value: 5
